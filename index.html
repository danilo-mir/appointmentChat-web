<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Médico 🏥</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-app">
        <header class="chat-app__header">
            <div class="chat-app__header-content">
                <div class="chat-app__header-avatar">
                    <div class="chat-app__header-avatar-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="white"/>
                            <path d="M2 17L12 22L22 17" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M2 12L12 17L22 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                </div>
                <div class="chat-app__header-info">
                    <h1 class="chat-app__header-title">Assistente Médico</h1>
                    <p class="chat-app__header-status">Online</p>
                </div>
                <div class="chat-app__header-medical-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2V22M2 12H22" stroke="white" stroke-width="3" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>
        </header>

        <main class="chat-app__container" id="chat-container">
            <div class="chat-app__welcome">
                <div class="chat-app__welcome-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2V22M2 12H22" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
                    </svg>
                </div>
                <h2 class="chat-app__welcome-title">Bem-vindo ao Assistente Médico</h2>
                <p class="chat-app__welcome-text">Como posso ajudá-lo hoje?</p>
            </div>
        </main>

        <div class="chat-app__input-container">
            <div class="chat-app__input-wrapper">
                <button class="chat-app__input-attach" aria-label="Anexar arquivo">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <input 
                    type="text" 
                    id="chat-input" 
                    class="chat-app__input" 
                    placeholder="Digite sua mensagem..." 
                    autocomplete="off"
                />
                <button id="send-button" class="chat-app__input-send" aria-label="Enviar mensagem">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <template id="typing-indicator-template">
        <div class="typing-indicator">
            <div class="typing-indicator__dot"></div>
            <div class="typing-indicator__dot"></div>
            <div class="typing-indicator__dot"></div>
        </div>
    </template>

    <script type="module" src="main.ts"></script>
</body>
</html>
